# AI Hub 反向代理配置
# 把这个文件放到 /etc/apache2/conf-available/ai-hub.conf
# 启用：a2enmod proxy proxy_http && a2enconf ai-hub && apache2ctl configtest && systemctl reload apache2
# 撤销：a2disconf ai-hub && systemctl reload apache2
#
# 作用：让同一台机器上 80 端口的 Apache 把 /aihub/ 路径转发到本机 8899 的 AI Hub
# 这样不需要在云控制台额外开放端口，也不需要停掉任何现有站点。

# 保证访问 /aihub 时补上结尾斜杠，否则页面相对路径会解析错位
RedirectMatch ^/aihub$ /aihub/

# 关闭正向代理（安全：避免这台机器被当成开放代理）
ProxyRequests Off

ProxyPreserveHost On

# SSE 流式输出需要放宽上游超时
ProxyTimeout 600

# flushpackets=on 是流式逐字输出的关键，不加会攒够一批才吐出来
ProxyPass        /aihub/ http://127.0.0.1:8899/ flushpackets=on
ProxyPassReverse /aihub/ http://127.0.0.1:8899/

# 转发真实客户端 IP，便于服务端日志排查
<Location /aihub/>
    RequestHeader set X-Forwarded-Proto "http"
</Location>
